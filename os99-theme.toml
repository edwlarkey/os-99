# OS 99 Platinum. Edit this, then run: os99 reload
#
# Values are logical pixels. Bar height is derived from ridges + margins so the
# plugin's reserved space and the art stay the same number.

[display]
scale = "auto"

[bar]
ridges        = 6
ridge_hi      = 1.6
ridge_lo      = 0.8
ridge_gap     = 0
margin_top    = 3.2
margin_bottom = 6.4
clear_inset_top    = 2
clear_inset_bottom = 1

[frame]
bezel         = 6
shadow_right  = 2
shadow_bottom = 3
shadow_opacity          = 60
shadow_opacity_inactive = 22

[buttons]
# close, kill, zoom, collapse, shade, float, pin, full
# Toggle live with: os99 buttons toggle <name>
left      = ["close"]
right     = ["zoom", "collapse"]
size      = 14
edge_pad  = 1
gap       = 4
clear_pad = 7

[text]
size      = 12
font      = "Charcoal"
clear_pad = 8

# Platinum, sampled from real OS 9 chrome.
[light]
face      = "D5D6D5"
dish      = "8C8C8C"
lit       = "FFFFFF"
shadow    = "A9A9A9"
deep      = "8A8A8A"
stripe_hi = "FFFFFF"
stripe_lo = "737373"
outline   = "2D2D2D"
rule      = "000000"
well_lo   = "A9A9A9"
well_hi   = "FFFFFF"
pressed   = "BBBBBB"
text      = "000000"
